<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영어과교육론1 - 조편성 학생 접속</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <div class="max-w-md w-full mx-auto my-auto">
    
    <!-- 1. 학생 정보 입력 폼 섹션 -->
    <div id="student-form-section" class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700 space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20 text-xl font-black">
          ENG
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tracking-tight">
          영어과교육론1
        </h1>
        <p class="text-xs sm:text-sm text-slate-500">
          그룹 수업 실연 조편성을 위해 정보를 입력해주세요.
        </p>
      </div>

      <form id="student-form" class="space-y-4">
        <!-- 학번 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">학번</label>
          <input 
            type="text" 
            id="input-student-id" 
            required 
            placeholder="예: 20241234"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition"
          >
        </div>

        <!-- 이름 입력 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">이름</label>
          <input 
            type="text" 
            id="input-name" 
            required 
            placeholder="예: 홍길동"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition"
          >
        </div>

        <!-- 성별 선택 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">성별</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-700 cursor-pointer hover:bg-indigo-50/40 has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 dark:has-[:checked]:bg-indigo-950/60 dark:has-[:checked]:border-indigo-500 dark:has-[:checked]:text-indigo-300 font-bold text-sm transition">
              <input type="radio" name="gender" id="gender-male" value="남" class="hidden">
              <span>남학생</span>
            </label>
            <label class="flex items-center justify-center gap-2 p-3.5 rounded-xl border-2 border-slate-200 dark:border-slate-700 cursor-pointer hover:bg-indigo-50/40 has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-600 has-[:checked]:text-indigo-700 dark:has-[:checked]:bg-indigo-950/60 dark:has-[:checked]:border-indigo-500 dark:has-[:checked]:text-indigo-300 font-bold text-sm transition">
              <input type="radio" name="gender" id="gender-female" value="여" checked class="hidden">
              <span>여학생</span>
            </label>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-base rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95 flex items-center justify-center gap-2"
        >
          입장 및 등록하기
        </button>
      </form>
    </div>

    <!-- 2. 접속 완료 & 대기 섹션 -->
    <div id="student-waiting-section" class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700 text-center space-y-5 hidden">
      <div class="w-16 h-16 mx-auto rounded-full bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 flex items-center justify-center text-3xl animate-pulse">
        ✓
      </div>
      <div class="space-y-1">
        <h2 class="text-xl font-black text-slate-900 dark:text-white">
          <span id="welcome-name" class="text-blue-600 dark:text-blue-400">학생</span>님, 등록 완료!
        </h2>
        <p class="text-xs text-slate-400 font-mono" id="welcome-id">20241234</p>
      </div>

      <div class="p-4 bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-100 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 space-y-2">
        <p class="font-bold text-sm text-slate-800 dark:text-white">교수자 화면을 주목해주세요 📺</p>
        <p>모든 학생의 접속이 완료되면 교수자가 그룹 배정을 시작합니다.</p>
      </div>

      <div class="inline-flex items-center gap-2 text-xs text-blue-600 dark:text-blue-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-blue-600 animate-ping"></span>
        실시간 대기 중...
      </div>
    </div>

    <!-- 3. 조편성 결과 섹션 (배정 완료 후) -->
    <div id="student-result-section" class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-5 hidden">
      
      <div class="text-center space-y-1">
        <span class="text-xs font-extrabold uppercase tracking-wider text-blue-600 dark:text-blue-400">Assignment Complete</span>
        <h2 id="my-group-name" class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white">
          제 1 조
        </h2>
      </div>

      <!-- 배정 정보 요약 카드 -->
      <div class="p-4 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-slate-700/70 dark:to-slate-800 rounded-2xl border border-blue-100 dark:border-slate-600 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500">실연 기능</span>
          <span id="my-skill-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-300">
            이해기능 - 듣기
          </span>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500">실연 주차</span>
          <span id="my-week-badge" class="text-xs font-extrabold text-indigo-600 dark:text-indigo-400">
            🗓️ 14주차 실연
          </span>
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-blue-200/60 dark:border-slate-600">
          <span class="text-xs font-bold text-slate-500">내 배정 역할</span>
          <span id="my-role-badge" class="text-sm font-black text-slate-900 dark:text-white bg-white dark:bg-slate-700 px-3 py-1 rounded-lg border border-slate-200 shadow-sm">
            도입 및 정리 활동
          </span>
        </div>
      </div>

      <!-- 팀원 명단 -->
      <div class="space-y-2">
        <h3 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider">팀원 명단 & 역할</h3>
        <div id="teammates-list" class="space-y-2"></div>
      </div>
    </div>

  </div>

  <footer class="mt-8 text-center text-xs text-slate-400">
    영어과교육론1 그룹 수업 실연 자동 조편성 시스템
  </footer>

  <!-- 스크립트 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/student.js"></script>
</body>
</html>
